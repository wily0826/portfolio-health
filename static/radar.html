<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>財報變動雷達</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/report.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .filters{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
    .filters select{min-width:150px;}
    #anomTbl tbody tr{cursor:pointer; transition:background .12s ease;}
    #anomTbl tbody tr:hover{background:#EEF5F6;}
    .detail-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
      border-bottom:2px solid var(--ink); padding-bottom:12px; flex-wrap:wrap;}
    .srctag{font-size:13px; color:var(--muted); font-weight:400;}
    .cwrap{position:relative; height:260px; margin-top:16px;}
    .report h3{font-size:16px; font-weight:700; margin:16px 0 6px;}
    .report p{margin:8px 0; max-width:70ch;}
    .report ul{list-style:none; margin:8px 0;}
    .report li{padding-left:18px; position:relative; margin:5px 0; max-width:70ch;}
    .report li::before{content:""; position:absolute; left:0; top:11px; width:5px; height:5px; border-radius:50%; background:var(--accent);}
    .disclaimer{font-size:13px; color:var(--muted); border-top:1px solid var(--rule); padding-top:12px; margin-top:14px;}
    @media (max-width:760px){ #anomTbl{min-width:620px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="rpt">
      <h1>財報變動雷達</h1>
      <nav class="nav">
        <a href="/dashboard">體檢報告</a>
        <a href="/radar" class="active">財報雷達</a>
        <a href="/eval">評估實驗</a>
        <a href="#" id="logout" class="logout">登出</a>
      </nav>
    </header>

    <div id="err" class="notice hidden"></div>

    <section>
      <div class="filters">
        <div class="fld"><label for="fSev">嚴重度</label>
          <select id="fSev"><option value="">全部</option><option>極端</option><option>顯著</option><option>注意</option></select></div>
        <div class="fld"><label for="fRule">規則</label>
          <select id="fRule">
            <option value="">全部</option>
            <option value="R-REV-YOY">月營收年增率顯著變動</option>
            <option value="R-GM-SHIFT">毛利率顯著變動</option>
            <option value="R-AR-DIV">應收帳款成長快於營收</option>
            <option value="R-INV-DIV">存貨成長快於營收</option>
            <option value="R-ACCRUAL">帳面獲利與現金流落差大</option>
          </select></div>
        <button class="btn" id="applyBtn">套用篩選</button>
        <button class="btn ghost" id="scanBtn">重新掃描</button>
      </div>
      <p class="hint" id="count" style="margin-top:14px"></p>
    </section>

    <section>
      <div class="tscroll"><table id="anomTbl">
        <thead><tr>
          <th>公司</th><th>產業</th><th>規則</th><th>期間</th><th>嚴重度</th><th>方向</th><th>範圍</th><th class="ta-r">z</th>
        </tr></thead>
        <tbody></tbody>
      </table></div>
      <p id="empty" class="hint hidden" style="margin-top:14px">目前沒有符合條件的財報變動旗標。可先按「重新掃描」。</p>
    </section>

    <section id="detail" class="hidden">
      <div class="detail-head"><h2 class="sec" id="dTitle" style="margin:0"></h2><span class="srctag" id="dSrc"></span></div>
      <div class="cwrap"><canvas id="dChart"></canvas></div>
      <div style="margin-top:16px">
        <button class="btn ghost" id="explainBtn"></button>
        <span class="hint" id="explainHint" style="margin-left:10px"></span>
      </div>
      <div id="dBody" class="report" style="margin-top:12px"></div>
      <div id="dNews" class="report" style="margin-top:4px"></div>
    </section>
    <div style="height:48px"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const err = $('err');
    const showErr = (m) => { err.className = 'notice'; err.textContent = m; window.scrollTo(0,0); };
    const showOk = (m) => { err.className = 'notice ok'; err.textContent = m; };
    const DIR = { up:'上升', down:'下降' }, SCOPE = { company:'公司', industry:'產業' };

    async function jget(path){
      const r = await fetch('/api' + path);
      if (r.status === 401){ location.href = '/'; return; }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d?.error?.message || '發生錯誤');
      return d;
    }
    async function jsend(method, path){
      const r = await fetch('/api' + path, { method });
      if (r.status === 401){ location.href = '/'; return; }
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d?.error?.message || '發生錯誤');
      return d;
    }

    // 極簡 Markdown（## 標題、- 清單、段落）；內容來自後端，非使用者輸入
    function renderMd(md){
      const esc = (s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const lines = md.split('\n'); let html='', inUl=false;
      const closeUl = ()=>{ if(inUl){ html+='</ul>'; inUl=false; } };
      for (const raw of lines){
        const line = raw.trimEnd();
        if (line.startsWith('## ')){ closeUl(); html+=`<h3>${esc(line.slice(3))}</h3>`; }
        else if (line.startsWith('- ')){ if(!inUl){ html+='<ul>'; inUl=true; } html+=`<li>${esc(line.slice(2))}</li>`; }
        else if (line.trim()===''){ closeUl(); }
        else { closeUl(); html+=`<p>${esc(line)}</p>`; }
      }
      closeUl(); return html;
    }
    function linkifyCitations(html, news){
      const map = {};
      for (const nw of (news||[])) if (/^https?:\/\//.test(nw.link)) map[nw.n] = nw.link;
      return html.replace(/\[(\d+)\]/g, (m,n)=> map[n] ? `<a href="${map[n]}" target="_blank" rel="noopener">[${n}]</a>` : m);
    }
    function renderNews(news){
      if (!news || !news.length) return '';
      const esc = (s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const li = news.map(nw => `<li>[${nw.n}] ${nw.published_at} ${esc(nw.source||'')}｜`
        + (/^https?:\/\//.test(nw.link) ? `<a href="${nw.link}" target="_blank" rel="noopener">${esc(nw.title)}</a>` : esc(nw.title))
        + '</li>').join('');
      return `<h3>引用新聞</h3><ul>${li}</ul>`;
    }

    let chart, curId = null, curDetail = null;
    function renderDetail(d){
      curDetail = d;
      $('detail').classList.remove('hidden');
      $('dTitle').textContent = `${d.name||''}（${d.symbol}）— ${d.rule}　${d.period}`;
      $('dSrc').textContent = d.explanation_source === 'llm' ? 'AI 生成（附引用）' : '規則式備援';
      const s = d.series || {};
      let labels = s.labels || [], values, ylabel;
      if (d.rule_id === 'R-REV-YOY'){ values = (s.yoy||[]).map(v=>v==null?null:v*100); ylabel = '營收年增率 %'; }
      else { values = (s.values||[]).map(v=>v==null?null:v*100); ylabel = (s.metric || '指標') + '（%）'; }
      chart?.destroy();
      chart = new Chart($('dChart'), {
        type:'line',
        data:{ labels, datasets:[{ data:values, borderColor:'#2A8C9B', backgroundColor:'rgba(42,140,155,.12)',
          fill:true, pointRadius:2, borderWidth:2, tension:.15 }] },
        options:{ maintainAspectRatio:false, animation:{duration:500},
          plugins:{ legend:{display:false}, title:{display:true, text:ylabel, color:'#6A7B82', font:{size:12}} },
          scales:{ x:{ ticks:{ maxTicksLimit:8, font:{size:11} }, grid:{display:false} },
            y:{ ticks:{font:{size:11}}, grid:{color:'#ECEFF0'} } } }
      });
      $('dBody').innerHTML = linkifyCitations(renderMd(d.explanation), d.news)
        + `<p class="disclaimer">本內容僅為依公開財報數字計算的變動說明，不構成投資建議，也不代表對公司經營或誠信的判斷。</p>`;
      $('dNews').innerHTML = renderNews(d.news);
      const btn = $('explainBtn');
      btn.textContent = d.explanation_source === 'llm' ? '重新產生 AI 解讀' : '產生 AI 解讀（RAG）';
      $('explainHint').textContent = d.explanation_source === 'llm'
        ? '已附新聞引用，程式驗證每點來源' : '目前為規則式備援；點左鈕以新聞來源產生附引用的 AI 解讀';
    }

    async function openDetail(id){
      try { curId = id; renderDetail(await jget('/anomalies/' + id)); $('detail').scrollIntoView({ behavior:'smooth' }); }
      catch(ex){ showErr(ex.message); }
    }

    $('explainBtn').onclick = async () => {
      if (curId == null) return;
      const btn = $('explainBtn'); const old = btn.textContent;
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span>產生中…（抓新聞→檢索→AI）';
      try {
        const force = curDetail && curDetail.explanation_source === 'llm';
        renderDetail(await jsend('POST', `/anomalies/${curId}/explain${force ? '?force=true' : ''}`));
      } catch(ex){ showErr(ex.message); btn.textContent = old; }
      finally { btn.disabled = false; }
    };

    async function load(){
      err.className = 'notice hidden';
      const sev = $('fSev').value, rule = $('fRule').value;
      const qs = new URLSearchParams();
      if (sev) qs.set('severity', sev);
      if (rule) qs.set('rule', rule);
      const d = await jget('/anomalies' + (qs.toString() ? '?' + qs : ''));
      const items = d.items || [];
      const tb = document.querySelector('#anomTbl tbody'); tb.innerHTML = '';
      $('empty').classList.toggle('hidden', items.length > 0);
      $('count').textContent = `共 ${items.length} 個旗標（依嚴重度、期間排序）`;
      for (const a of items){
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${a.symbol}</strong><br><span class="hint">${a.name||''}</span></td>
          <td>${a.sector||'—'}</td>
          <td>${a.rule}</td>
          <td>${a.period}</td>
          <td><span class="sev sev-${a.severity}">${a.severity}</span></td>
          <td>${DIR[a.direction]||a.direction}</td>
          <td>${SCOPE[a.scope]||'—'}</td>
          <td class="ta-r num">${a.z!=null?a.z.toFixed(1):'—'}</td>`;
        tr.onclick = () => openDetail(a.id);
        tb.appendChild(tr);
      }
    }

    $('applyBtn').onclick = () => load().catch(ex => showErr(ex.message));
    $('scanBtn').onclick = async () => {
      const b = $('scanBtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>掃描中…';
      try { const r = await jsend('POST', '/anomalies/scan'); await load(); showOk(`完成：偵測到 ${r.n_flags} 個旗標`); }
      catch(ex){ showErr(ex.message); }
      finally { b.disabled = false; b.textContent = '重新掃描'; }
    };
    $('logout').onclick = async (e) => { e.preventDefault(); try { await jsend('POST','/auth/logout'); } finally { location.href='/'; } };

    (async function init(){ try { await jget('/auth/me'); await load(); } catch(ex){ location.href='/'; } })();
  </script>
</body>
</html>
