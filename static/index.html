<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投資組合體檢報告 — 登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/report.css">
  <style>
    .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
    .auth-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--rule); border-radius:8px; padding:36px 32px;}
    .auth-card h1{font-size:24px; font-weight:700; margin-bottom:6px;}
    .auth-card .intro{font-size:14px; color:var(--muted); line-height:1.6; margin-bottom:8px;}
    .auth-card .rule-line{height:2px; background:var(--ink); margin:14px 0 22px;}
    .auth form{display:flex; flex-direction:column;}
    .auth label{font-size:13px; color:var(--muted); margin:14px 0 6px;}
    .auth form > label:first-of-type{margin-top:0;}
    .auth input{width:100%;}
    .auth .btn{width:100%; margin-top:22px; text-align:center;}
    .auth .switch{text-align:center; font-size:14px; color:var(--muted); margin-top:18px;}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card auth">
      <h1>投資組合體檢報告</h1>
      <p class="intro">輸入台股持股，由程式計算風險指標、偵測財報變動，再由 AI 以白話文解讀。</p>
      <div class="rule-line"></div>

      <div id="err" class="notice hidden"></div>

      <!-- 登入 -->
      <form id="loginForm">
        <label for="l_email">Email</label>
        <input type="email" id="l_email" required autocomplete="email">
        <label for="l_pw">密碼</label>
        <input type="password" id="l_pw" required autocomplete="current-password">
        <button type="submit" class="btn">登入</button>
        <p class="switch">還沒有帳號？<a href="#" id="toReg">前往註冊</a></p>
      </form>

      <!-- 註冊 -->
      <form id="regForm" class="hidden">
        <label for="r_name">顯示名稱</label>
        <input type="text" id="r_name" required>
        <label for="r_email">Email</label>
        <input type="email" id="r_email" required autocomplete="email">
        <label for="r_pw">密碼（至少 8 碼）</label>
        <input type="password" id="r_pw" required minlength="8" autocomplete="new-password">
        <label for="r_pw2">確認密碼</label>
        <input type="password" id="r_pw2" required minlength="8">
        <button type="submit" class="btn">註冊</button>
        <p class="switch">已經有帳號？<a href="#" id="toLogin">返回登入</a></p>
      </form>
    </div>
  </div>

  <script>
    const err = document.getElementById('err');
    const showErr = (m) => { err.className = 'notice'; err.textContent = m; };
    const hideErr = () => { err.className = 'notice hidden'; };

    const loginForm = document.getElementById('loginForm');
    const regForm = document.getElementById('regForm');
    document.getElementById('toReg').onclick = (e) => { e.preventDefault(); hideErr(); loginForm.classList.add('hidden'); regForm.classList.remove('hidden'); };
    document.getElementById('toLogin').onclick = (e) => { e.preventDefault(); hideErr(); regForm.classList.add('hidden'); loginForm.classList.remove('hidden'); };

    async function api(path, body){
      const r = await fetch('/api' + path, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data?.error?.message || '發生錯誤');
      return data;
    }

    loginForm.onsubmit = async (e) => {
      e.preventDefault(); hideErr();
      try { await api('/auth/login', { email: l_email.value, password: l_pw.value }); location.href = '/dashboard'; }
      catch (ex) { showErr(ex.message); }
    };
    regForm.onsubmit = async (e) => {
      e.preventDefault(); hideErr();
      if (r_pw.value !== r_pw2.value) return showErr('兩次密碼不一致。');
      try {
        await api('/auth/register', { email: r_email.value, password: r_pw.value, display_name: r_name.value });
        await api('/auth/login', { email: r_email.value, password: r_pw.value });
        location.href = '/dashboard';
      } catch (ex) { showErr(ex.message); }
    };
  </script>
</body>
</html>
